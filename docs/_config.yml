title: Molly
description: Run local coding tasks, check the result, and review the complexity of each change.
url: https://sifrious.github.io
baseurl: /molly
repository: sifrious/molly
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  smart_quotes: [apos, apos, quot, quot]
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
defaults:
  - scope:
      path: ""
    values:
      layout: default
navigation:
  - title: Start here
    pages:
      - title: Overview
        url: /
      - title: Getting started
        url: /getting-started.html
      - title: QuickStart — Ollama
        url: /ollama-quickstart.html
      - title: v0.1 QUICKSTART
        url: /v0.1/QUICKSTART.html
      - title: v0.1 FRICTION
        url: /v0.1/FRICTION.html
      - title: Tasks and retries
        url: /tasks.html
      - title: Planning
        url: /planning.html
      - title: Agents and MCP
        url: /agents.html
      - title: Next-step advice
        url: /task-advice.html
      - title: Web interface
        url: /web-interface.html
      - title: Verification and review
        url: /verification.html
      - title: Component snapshots
        url: /component-snapshots.html
      - title: Laravel knowledge
        url: /knowledge-graph.html
      - title: Project graph
        url: /project-graph.html
      - title: Task journals
        url: /journal.html
      - title: Task connections
        url: /connections.html
      - title: Troubleshooting
        url: /troubleshooting.html
  - title: Reference
    pages:
      - title: Commands
        url: /reference/commands.html
      - title: Configuration
        url: /reference/configuration.html
      - title: Glossary
        url: /reference/glossary.html
  - title: Project
    pages:
      - title: Contributing
        url: /contributing.html
      - title: Orb connection plan
        url: /execution-targets.html
      - title: Publishing the docs
        url: /publishing.html
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
