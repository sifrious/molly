title: Molly
description: A local-first Laravel coding agent. The model can propose the work. Evidence decides whether the work is done.
url: https://sifrious.github.io
baseurl: /molly
repository: sifrious/molly
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  smart_quotes: [apos, apos, quot, quot]
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
defaults:
  - scope:
      path: ""
    values:
      layout: default
navigation:
  - title: Start here
    pages:
      - title: Home
        url: /
      - title: Documentation
        url: /overview.html
      - title: Getting started
        url: /getting-started.html
      - title: Tasks
        url: /tasks.html
      - title: Verification
        url: /verification.html
      - title: Tutorials
        url: /tutorials.html
      - title: Troubleshooting
        url: /troubleshooting.html
  - title: Using Molly
    pages:
      - title: Molly on its own
        url: /standalone.html
      - title: Molly with Bloom
        url: /bloom.html
      - title: Ollama
        url: /ollama-quickstart.html
      - title: Agents and MCP
        url: /agents.html
      - title: Web interface
        url: /web-interface.html
      - title: Planning
        url: /planning.html
      - title: Task advice
        url: /task-advice.html
      - title: Project graph
        url: /project-graph.html
      - title: Laravel knowledge
        url: /knowledge-graph.html
      - title: Journals and decisions
        url: /journal.html
      - title: Inspecting tasks and runs
        url: /inspection.html
      - title: Component snapshots
        url: /component-snapshots.html
      - title: Amp thread links
        url: /connections.html
      - title: Settings
        url: /settings.html
      - title: Compatibility
        url: /compatibility.html
  - title: Reference
    pages:
      - title: Commands
        url: /reference/commands.html
      - title: Configuration
        url: /reference/configuration.html
      - title: Glossary
        url: /reference/glossary.html
  - title: Project
    pages:
      - title: Contributing
        url: /contributing.html
      - title: Execution targets (planned)
        url: /execution-targets.html
      - title: Publishing the docs
        url: /publishing.html
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
