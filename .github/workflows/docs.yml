name: Documentation

on:
  push:
    paths:
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check documentation links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check Markdown links and anchors
        run: python3 bin/molly-docs-check
