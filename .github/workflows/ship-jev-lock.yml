name: Ship Jev lock

on:
  push:
    branches:
      - release/ship-jev

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, '[jev-lock]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: curl, dom, mbstring, pcntl, pdo_sqlite, posix, sqlite3, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - name: Resolve pinned Laravel AI line
        run: composer update laravel/ai --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - name: Validate resolved lock
        run: |
          composer validate --strict --no-check-all
          composer audit --locked
      - name: Commit refreshed lock
        run: |
          git config user.email "molly-ci@sifrious.invalid"
          git config user.name "Molly CI"
          git add composer.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "MME-5200: refresh Laravel AI lock [jev-lock]"
          git push
