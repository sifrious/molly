name: Package tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - name: Check out the package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, mbstring, pcntl, pdo_sqlite, posix, sqlite3, xml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-lock

      - name: Install package and test dependencies
        timeout-minutes: 8
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run package tests
        timeout-minutes: 5
        run: |
          seed=$((GITHUB_RUN_ID % 2147483647))
          echo "Pest random-order seed: $seed"
          vendor/bin/pest --colors=never --order-by=random --random-order-seed="$seed" --fail-on-warning --fail-on-risky --fail-on-phpunit-warning

  coverage:
    name: PHP 8.4 coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up PHP with PCOV
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: curl, dom, mbstring, pcntl, pdo_sqlite, posix, sqlite3, xml, xmlwriter
          coverage: pcov
          tools: composer:v2

      - name: Install package and test dependencies
        timeout-minutes: 8
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Measure coverage
        timeout-minutes: 5
        run: vendor/bin/pest --colors=never --coverage-clover=build/coverage/clover.xml --coverage-html=build/coverage/html --coverage-text=build/coverage/summary.txt

      - name: Upload coverage reports
        if: ${{ !cancelled() && hashFiles('build/coverage/clover.xml') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: php-8.4-coverage
          path: build/coverage/
          if-no-files-found: error
          retention-days: 14

  install:
    name: Fresh Laravel 13 installation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: curl, dom, mbstring, pcntl, pdo_sqlite, posix, sqlite3, xml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Install into a fresh Laravel application
        timeout-minutes: 10
        run: |
          composer create-project laravel/laravel "$RUNNER_TEMP/molly-host" '^13.0' --no-interaction --prefer-dist
          cd "$RUNNER_TEMP/molly-host"
          composer config repositories.molly path "$GITHUB_WORKSPACE"
          composer require --dev 'sifrious/molly:@dev' --no-interaction --prefer-dist --no-progress
          php artisan vendor:publish --tag=molly-config --no-interaction
          php artisan migrate --no-interaction

      - name: Create and read a saved task without a model
        timeout-minutes: 2
        run: |
          cd "$RUNNER_TEMP/molly-host"
          php artisan molly:create 'Add a readiness route and its test.' --file=routes/web.php --test=tests/Feature/MollySmokeTest.php --name=smoke-test --json --no-interaction > "$RUNNER_TEMP/molly-created.json"
          task_id=$(php -r '$task = json_decode(file_get_contents(getenv("RUNNER_TEMP")."/molly-created.json"), true, flags: JSON_THROW_ON_ERROR); if (($task["status"] ?? null) !== "pending" || !is_string($task["id"] ?? null) || $task["id"] === "" || ($task["task"]["id"] ?? null) !== $task["id"]) { exit(1); } echo $task["id"];')
          php artisan molly:task "$task_id" --json --no-interaction > "$RUNNER_TEMP/molly-found-by-id.json"
          php artisan molly:task smoke-test --json --no-interaction > "$RUNNER_TEMP/molly-found.json"
          php -r '$created = json_decode(file_get_contents(getenv("RUNNER_TEMP")."/molly-created.json"), true, flags: JSON_THROW_ON_ERROR); $found = json_decode(file_get_contents(getenv("RUNNER_TEMP")."/molly-found.json"), true, flags: JSON_THROW_ON_ERROR); if (($found["id"] ?? null) !== $created["id"] || ($found["status"] ?? null) !== "pending" || ($found["task"]["id"] ?? null) !== $created["id"]) { exit(1); } echo "Created and retrieved the pending task without executing a model.\n";'

      - name: Index Laravel knowledge without Burdgen packages
        timeout-minutes: 2
        run: |
          cd "$RUNNER_TEMP/molly-host"
          composer show --format=json > "$RUNNER_TEMP/molly-packages.json"
          php -r '$packages = json_decode(file_get_contents(getenv("RUNNER_TEMP")."/molly-packages.json"), true, flags: JSON_THROW_ON_ERROR)["installed"] ?? []; foreach ($packages as $package) { if (str_contains($package["name"] ?? "", "burdgen")) { exit(1); } }'
          php artisan molly:knowledge:index laravel --laravel-version=13 --json --no-interaction > "$RUNNER_TEMP/molly-knowledge-index.json"
          php artisan molly:knowledge:query Queue --laravel-version=13 --depth=3 --limit=40 --json --no-interaction > "$RUNNER_TEMP/molly-knowledge-query.json"
          php -r '$result = json_decode(file_get_contents(getenv("RUNNER_TEMP")."/molly-knowledge-query.json"), true, flags: JSON_THROW_ON_ERROR); $labels = array_column($result["nodes"] ?? [], "label"); if (!in_array("Retry", $labels, true) || !in_array("ShouldQueue", $labels, true)) { exit(1); } foreach ([...($result["nodes"] ?? []), ...($result["edges"] ?? [])] as $record) { if (($record["sources"] ?? []) === []) { exit(1); } } echo "Indexed versioned Laravel queue knowledge with source provenance.\n";'

      - name: Keep the development package out of production installs
        run: |
          cd "$RUNNER_TEMP/molly-host"
          composer install --no-dev --no-interaction --prefer-dist --no-progress
          php artisan list --raw > "$RUNNER_TEMP/production-commands.txt"
          php -r '$commands = file_get_contents(getenv("RUNNER_TEMP")."/production-commands.txt"); if (preg_match("/^molly:/m", $commands)) { exit(1); } echo "Production commands do not load Molly.\n";'

      - name: Check the download contents and size
        run: |
          git archive --format=zip --output="$RUNNER_TEMP/molly.zip" HEAD
          composer archive --format=zip --dir="$RUNNER_TEMP" --file=molly-composer --no-interaction
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          for filename in ['molly.zip', 'molly-composer.zip']:
              archive = Path(os.environ['RUNNER_TEMP']) / filename
              with ZipFile(archive) as package:
                  names = package.namelist()
                  assert not any('/tests/' in '/' + name or name.startswith('.github/') for name in names)
                  assert not any(name == '.git' or name.startswith(('.git/', '_site/', 'docs/_site/', 'docs/.jekyll-cache/')) for name in names)
                  assert 'resources/planning/guide.json' in names
                  assert 'resources/planning/LARAVEL-LICENSE.md' in names
                  assert 'src/Complexity/LICENSE.md' in names
                  assert sum(item.file_size for item in package.infolist() if item.filename.startswith('resources/planning/')) <= 128 * 1024
                  size = archive.stat().st_size
                  print(f'{filename}: {size} bytes')
                  assert size <= 272 * 1024
          PY
